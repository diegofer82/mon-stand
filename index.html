<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Mon Stand — Debajah Création</title>
    <!-- Corte de la v1 (2026-10-01): esta dirección ya no sirve la app. Redirige a la v2 (Cloudflare Workers).
         La página no toca el localStorage de la v1: los datos antiguos del teléfono siguen ahí, sin usar.
         La v1.5 está archivada en legacy/v1.5/ (no se publica). -->
    <meta
      http-equiv="refresh"
      content="3; url=https://mon-stand.applis.workers.dev/"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #1f0f3d;
        color: #fff;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      .marque {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.75rem;
        font-weight: 600;
      }
      .marque span {
        color: #e0b12f;
      }
      p {
        margin: 1rem 0;
        line-height: 1.5;
        color: #c8bce0;
      }
      a.bouton {
        display: block;
        margin-top: 1.5rem;
        padding: 1rem 1.25rem;
        border-radius: 12px;
        background: #e0b12f;
        color: #1f0f3d;
        font-weight: 700;
        font-size: 1.05rem;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 1.5rem;
        color: #9b8fb8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="marque">Debajah <span>Création</span></div>
      <p>Mon Stand a déménagé. La nouvelle version s’ouvre dans un instant…</p>
      <a class="bouton" href="https://mon-stand.applis.workers.dev/"
        >Ouvrir Mon Stand</a
      >
      <small>
        Pensez à ajouter la nouvelle adresse à l’écran d’accueil du téléphone,
        puis à supprimer l’ancien raccourci.
      </small>
    </main>
    <script>
      window.location.replace("https://mon-stand.applis.workers.dev/");
    </script>
  </body>
</html>
